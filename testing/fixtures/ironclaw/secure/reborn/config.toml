# IronClaw 1.x (Reborn) boot config as written by `ironclaw onboard` (1.4.0),
# comments trimmed — ~/.ironclaw/reborn/config.toml
api_version = "ironclaw.runtime/v1"

[boot]
profile = "local-dev"

[identity]
default_owner  = "reborn-cli"

[runner]
heartbeat_interval_secs = 15
poll_interval_ms        = 200

[skills]
regex_activation_enabled = true

[llm]

[llm.default]
provider_id = "ollama"
model = "llama3.2"
