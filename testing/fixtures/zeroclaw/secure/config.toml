# ZeroClaw V3 config — hardened fixture (locked_down preset, encrypted secrets).
schema_version = 3

[secrets]
encrypt = true

[gateway]
host = "127.0.0.1"
port = 42617
require_pairing = true
allow_public_bind = false

[tunnel]
tunnel_provider = "none"

[providers.models.anthropic.default]
model = "claude-sonnet-4-5"
api_key = "enc2:5f0c2b7a91d4e3a8c6b1f0e29d7a4c3b8e1f6a2d9c0b7e4a1f3d6c8b2e5a9f0c"

[agents.assistant]
enabled = true
model_provider = "anthropic.default"
risk_profile = "locked_down"

[agents.assistant.workspace]
unrestricted_filesystem = false

[risk_profiles.locked_down]
level = "supervised"
workspace_only = true
allowed_commands = ["git", "ls", "cat", "grep"]
forbidden_paths = ["/etc", "/root", "~/.ssh", "~/.gnupg", "~/.aws"]
require_approval_for_medium_risk = true
block_high_risk_commands = true
auto_approve = ["file_read", "memory_recall"]
always_ask = []
sandbox_enabled = true

[skills]
open_skills_enabled = false
allow_scripts = false

[browser]
enabled = false

[http_request]
enabled = true
allowed_domains = ["api.example.com"]
allow_private_hosts = false

[runtime]
kind = "native"
