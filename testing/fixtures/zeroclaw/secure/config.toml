[server]
host = "127.0.0.1"
port = 3000

[secrets]
encrypt = true
method = "chacha20"

[tunnel]
provider = "cloudflare"

[security]
require_pairing = true
allow_public_bind = false

[autonomy]
level = "supervised"

[workspace]
workspace_only = true

[channels.telegram]
enabled = true
allowed_users = ["123456789"]

[skills]
open_install = false

[tools.browser]
enabled = true
allowed_domains = ["example.com", "docs.example.com"]

[tools.http]
enabled = true
allowed_domains = ["api.example.com"]

[runtime]
kind = "firejail"
sandbox = "firejail"
