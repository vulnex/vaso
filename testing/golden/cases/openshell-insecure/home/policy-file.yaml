version: 1
filesystem_policy:
  read_only: [/usr]
  read_write: [/sandbox, /etc, /usr/local/bin]
network_policies:
  anything:
    endpoints:
      - host: api.example.com
        port: 443
        tls: skip
      - host: other.example.com
        port: 443
      - host: mcp.example.com
        port: 443
        protocol: mcp
        mcp: { allow_all_known_mcp_methods: true }
      - host: rest.example.com
        port: 443
        protocol: rest
        access: full
        allow_uninspected_credentials: true
      - allowed_ips: ["0.0.0.0/0"]
        port: 443
      - allowed_ips: ["10.0.0.0/8"]
        port: 22
      - host: host.openshell.internal
        port: 8000
    binaries:
      - path: /**
