services:
  # Build the base image first:
  #   docker compose -f testing/docker-compose.yml build base
  base:
    build:
      context: ..
      dockerfile: testing/docker/base.Dockerfile
    image: vaso-test-base

  # OpenClaw scenarios
  openclaw-insecure:
    build:
      context: ..
      dockerfile: testing/docker/agents/openclaw.Dockerfile
      args:
        BASE_IMAGE: vaso-test-base
        SCENARIO: insecure
    depends_on:
      base:
        condition: service_completed_successfully

  openclaw-secure:
    build:
      context: ..
      dockerfile: testing/docker/agents/openclaw.Dockerfile
      args:
        BASE_IMAGE: vaso-test-base
        SCENARIO: secure
    depends_on:
      base:
        condition: service_completed_successfully

  # NanoClaw scenarios
  nanoclaw-insecure:
