name: VASO Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 6am

jobs:
  # Self-scan against the current source so PRs catch issues they introduce.
  self-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # required for upload-sarif
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build
        run: |
          npm ci
          npm run build
          npm link

      - name: Scan with current source
        run: vaso scan --format sarif -o vaso-results.sarif --fail-on critical

      - name: Upload SARIF to Code Scanning
        if: always() && hashFiles('vaso-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: vaso-results.sarif

      - name: Upload scan artifact
        if: always() && hashFiles('vaso-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: vaso-self-scan
          path: vaso-results.sarif
